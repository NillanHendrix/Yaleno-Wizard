name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # Installer an das Release hängen (nur bei Tags)

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ubuntu-Abhängigkeiten für Qt (offscreen-Tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --noconfirm --clean yaleno_wizard.spec

      - name: Version ermitteln
        shell: bash
        run: echo "VERSION=$(python -c 'import yaleno_wizard; print(yaleno_wizard.__version__)')" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- Windows: Installer
      - name: Inno Setup installieren
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Installer bauen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\yaleno-wizard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------- Linux: Archiv mit install.sh
      - name: Linux-Archiv packen
        if: runner.os == 'Linux'
        run: sh scripts/pack_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: yaleno-wizard-${{ runner.os }}
          path: |
            dist/yaleno-wizard-setup-*.exe
            dist/yaleno-wizard.exe
            dist/yaleno-wizard-*-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/yaleno-wizard-setup-*.exe
            dist/yaleno-wizard-*-linux-x86_64.tar.gz
