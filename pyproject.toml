[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaleno-wizard"
version = "0.1.0"
description = "Yaleno Wizard – Sichern und Wiederherstellen von Konfiguration, Einstellungen und persönlichen Dateien über SFTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "paramiko>=3.4",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
yaleno-wizard = "yaleno_wizard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
