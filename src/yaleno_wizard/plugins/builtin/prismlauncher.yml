# Yaleno-Plugin: Prism Launcher (Minecraft) – Einstellungen, Konten und Instanzen abgleichen.
yaleno_plugin: 1
id: prismlauncher
name: Prism Launcher (Minecraft)
version: 1.0.0
author: Yaleno Wizard
description: >-
  Einstellungen, Konten und Instanzen (Welten, Mods, Ressourcenpakete, Konfiguration) des
  Prism Launcher. Neu ladbare Dateien (Bibliotheken, Assets, Java, Caches, Logs) werden ausgelassen.
  Launcher vor dem Abgleich schließen!
source: https://raw.githubusercontent.com/NillanHendrix/Yaleno-Wizard/main/src/yaleno_wizard/plugins/builtin/prismlauncher.yml
homepage: https://prismlauncher.org
type: catalog
categories:
  - id: games
    name: Spiele
    description: >-
      Minecraft über den Prism Launcher: Einstellungen, Konten und Instanzen mit Welten und Mods.
      Enthält die Anmeldung beim Microsoft-Konto – nur auf einen vertrauenswürdigen Speicher!
    os: [linux, windows]
    sensitive: true
    items:
      - id: prism-settings
        label: Prism Launcher – Einstellungen & Konten
        paths:
          linux:
            - "{DATA}/PrismLauncher/prismlauncher.cfg"
            - "{DATA}/PrismLauncher/accounts.json"
            - "{DATA}/PrismLauncher/icons"
            - "{DATA}/PrismLauncher/themes"
            - "{DATA}/PrismLauncher/iconthemes"
            - "{HOME}/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/prismlauncher.cfg"
            - "{HOME}/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/accounts.json"
            - "{HOME}/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/icons"
            - "{HOME}/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/themes"
          windows:
            - "{APPDATA}/PrismLauncher/prismlauncher.cfg"
            - "{APPDATA}/PrismLauncher/accounts.json"
            - "{APPDATA}/PrismLauncher/icons"
            - "{APPDATA}/PrismLauncher/themes"
            - "{APPDATA}/PrismLauncher/iconthemes"
      - id: prism-instances
        label: Prism Launcher – Instanzen (Welten, Mods, Konfiguration)
        paths:
          linux:
            - "{DATA}/PrismLauncher/instances"
            - "{HOME}/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances"
          windows:
            - "{APPDATA}/PrismLauncher/instances"
        excludes:
          - logs
          - crash-reports
          - "*.log"
          - "*.log.gz"
          - .cache
          - .fabric
          - .mixin.out
          - natives
          - debug
          - screenshots/.thumbnails
