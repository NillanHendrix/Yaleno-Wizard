# Yaleno-Plugin: schaltet eine eingebaute Funktion frei (enthält keinen Programmcode).
yaleno_plugin: 1
id: verschluesselung
name: Verschlüsselung (Ende-zu-Ende)
version: 1.0.0
author: Yaleno Wizard
description: >-
  Verschlüsselt alle Inhalte und den Versionsverlauf (Pfade, Dateinamen, Geräte) mit AES-256-GCM, bevor sie den Rechner verlassen. Der Speicher-Betreiber sieht nur unlesbare Daten. Entsperren per Passwort, Wiederherstellungsschlüssel oder Security-Key (Plugin „Passkey“).
source: https://raw.githubusercontent.com/NillanHendrix/Yaleno-Wizard/main/src/yaleno_wizard/plugins/builtin/verschluesselung.yml
type: feature
feature: encryption
