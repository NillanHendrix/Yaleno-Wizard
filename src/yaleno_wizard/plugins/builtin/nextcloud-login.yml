# Yaleno-Plugin: schaltet eine eingebaute Funktion frei (enthält keinen Programmcode).
yaleno_plugin: 1
id: nextcloud-login
name: Nextcloud-Anmeldung im Browser
version: 1.0.0
author: Yaleno Wizard
description: >-
  Meldet sich über das Nextcloud-Anmeldefenster im Browser an (auch mit Passkey oder Zwei-Faktor) und legt dabei automatisch ein App-Passwort an.
source: https://raw.githubusercontent.com/NillanHendrix/Yaleno-Wizard/main/src/yaleno_wizard/plugins/builtin/nextcloud-login.yml
type: feature
feature: nextcloud_login_flow
