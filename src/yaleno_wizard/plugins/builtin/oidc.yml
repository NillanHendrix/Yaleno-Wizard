# Yaleno-Plugin: schaltet eine eingebaute Funktion frei (enthält keinen Programmcode).
yaleno_plugin: 1
id: oidc
name: Anmeldung per OpenID Connect (OIDC)
version: 1.0.0
author: Yaleno Wizard
description: >-
  Anmeldung an Nextcloud/WebDAV über einen OIDC-Anbieter (Keycloak, Authentik, Azure AD …) im Browser. Voraussetzung: Nextcloud-App „user_oidc“ mit Bearer-Token-Prüfung.
source: https://raw.githubusercontent.com/NillanHendrix/Yaleno-Wizard/main/src/yaleno_wizard/plugins/builtin/oidc.yml
type: feature
feature: oidc
